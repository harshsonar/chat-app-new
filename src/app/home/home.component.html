<div class="flex justify-between m-4">
    <div>
        Username: <span class="font-semibold">{{currentUserUsername}}</span>
    </div>
    <div>
        <p-button label="Logout" severity="danger" (click)="logout()"></p-button>
    </div>
</div>

<div class="h-screen flex">
    <div class="left-panel w-1/3 m-2 rounded-md p-1">
        <div class="chat-list bg-gray rounded-md w-full max-w-full">
            <nb-layout>
                <nb-layout-column>
                    <nb-list class="space-y-2">
                        @for (user of users; track user.title) {
                        <nb-list-item class="bg-blue-200 cursor-pointer p-3 rounded-lg shadow-sm border border-blue-300 hover:bg-blue-100 click:bg-blue-200 active:bg-blue-300">
                            <nb-user [name]="user.name" [title]="user.title"></nb-user>
                        </nb-list-item>
                        }
                    </nb-list>
                </nb-layout-column>
            </nb-layout>
        </div>
    </div>


    <div class="right-panel w-2/3 m-2 rounded-md p-1">
        hello again
    </div>
</div>
